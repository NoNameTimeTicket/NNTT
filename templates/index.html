{% extends 'base.html' %}

{% block title %}메인 - NNTT 통합 예매{% endblock %}

{% block content %}
    <!-- 장르별 탭 -->
    <div style="display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 2px solid #ddd; padding-bottom: 10px;">
        <a href="{{ url_for('main.index', genre='all') }}" style="text-decoration: none; padding: 8px 16px; background-color: #333; color: white; border-radius: 20px;">전체</a>
        <a href="{{ url_for('main.index', genre='musical') }}" style="text-decoration: none; padding: 8px 16px; background-color: #eee; color: #333; border-radius: 20px;">뮤지컬</a>
        <a href="{{ url_for('main.index', genre='play') }}" style="text-decoration: none; padding: 8px 16px; background-color: #eee; color: #333; border-radius: 20px;">연극</a>
        <a href="{{ url_for('main.index', genre='concert') }}" style="text-decoration: none; padding: 8px 16px; background-color: #eee; color: #333; border-radius: 20px;">콘서트</a>
    </div>

    <h2>공연 목록</h2>
    
    <!-- 공연 카드 카드 그리드 레이아웃 -->
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 20px;">
        <!-- 예시 공연 1 -->
        <div style="border: 1px solid #ddd; border-radius: 8px; padding: 15px; background: white;">
            <h3>뮤지컬 〈NNTT〉</h3>
            <p style="color: #666; font-size: 0.85rem; margin: 8px 0;">2026.08.01 ~ 2026.08.31</p>
            <a href="{{ url_for('main.performance_detail', perf_id=1) }}" style="display: inline-block; padding: 6px 12px; background: #ff4757; color: white; text-decoration: none; border-radius: 4px; margin-top: 10px;">상세보기 및 예매</a>
        </div>
    </div>
{% endblock %}
