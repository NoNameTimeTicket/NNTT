<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>예매하기 - NNTT</title>
    <!-- 🎨 예매창 디자인(글자 크기, 색상, 배치 등)을 담당하는 CSS 파일 불러오기 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/booking.css') }}">
</head>
<body>

<div class="popup-card">
    <!-- 🎭 상단에 들어가는 공연 제목 (예: 🎭 뮤지컬 캣츠) -->
    <h2 class="popup-title">🎭 {{ data.title }}</h2>

    <!-- 📩 가상 결제 완료 버튼을 누르면 booking.pay_process(서버)로 데이터를 보냅니다 -->
    <form action="{{ url_for('booking.pay_process') }}" method="POST" id="bookingForm">
        
        <!-- 🔒 화면에는 안 보이지만 서버로 함께 전달되는 정보들 -->
        <input type="hidden" name="title" value="{{ data.title }}">
        <input type="hidden" name="place_name" value="{{ data.place_name }}">
        <input type="hidden" name="address" value="{{ data.address }}">
        <input type="hidden" id="unitPrice" value="{{ data.unit_price }}">
        <input type="hidden" id="ticketCountInput" name="ticket_count" value="1">

        <div class="popup-body">
            <!-- 👈 [왼쪽 동네] 달력 표가 그려지는 공간 -->
            <div class="left-box">
                <label class="form-label">📆 관람 날짜 선택</label>
                <!-- 달력에서 클릭한 날짜가 저장되는 상자 -->
                <input type="hidden" id="datePicker" name="booking_date" value="{{ data.today }}" required>
                <!-- 🌟 자바스크립트(booking.js)가 여기에 큼직한 월력표를 완성해 줍니다 -->
                <div id="customCalendar" class="calendar-container"></div>
            </div>

            <!-- 👉 [오른쪽 동네] 예약자 정보, 회차 선택, 인원 선택 구역 -->
            <div class="right-box">
                <!-- 👤 예약자 ID 및 전화번호 (span.info-value로 글자를 진하고 커지게 만듦) -->
                <div class="info-item">
                    <strong>예약자 ID:</strong> <span class="info-value">{{ g.user.username }}</span><br>
                    <strong>전화번호:</strong> <span class="info-value">{{ data.user_phone }}</span>
                </div>

                <!-- 📍 공연 장소 정보 -->
                <div class="info-item">
                    <strong>공연 장소:</strong> <span class="info-value">{{ data.place_name }}</span>
                </div>

                <!-- 💵 티켓 한 장 가격 (price-highlight 클래스로 빨간색 강조) -->
                <div class="info-item">
                    <strong>티켓 단가:</strong> <span class="info-value price-highlight">{{ data.unit_price_text }}</span>
                </div>

                <!-- ⏰ 회차(공연 시간) 선택 드롭다운 상자 -->
                <div>
                    <label class="form-label">⏰ 회차 선택 (공연 시간)</label>
                    <select name="booking_time" required class="form-control">
                        {% for time_str in data.available_times %}
                            <option value="{{ time_str }}">{{ time_str }} 공연</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- 👥 인원수 조절 (+ / -) 버튼 -->
                <div>
                    <label class="form-label">👥 예약 인원</label>
                    <div class="counter-wrap">
                        <button type="button" id="btnMinus" class="btn-count">-</button>
                        <span id="countNum" class="count-display">1</span>
                        <button type="button" id="btnPlus" class="btn-count">+</button>
                    </div>
                </div>

                <!-- 💰 최종 결제 금액 표시 박스 -->
                <div class="price-box">
                    <span>최종 결제 금액:</span>
                    <span id="totalPriceText">{{ data.unit_price_text }}</span>
                </div>
            </div>
        </div>

        <!-- 🚀 하단 가상 결제 완료 제출 버튼 -->
        <button type="submit" class="btn-pay">
            가상 결제 완료하기 ➔
        </button>
    </form>
</div>

<!-- ⚙️ 작동(달력 그리기, 인원수 계산)을 담당하는 자바스크립트 파일 불러오기 -->
<script src="{{ url_for('static', filename='js/booking.js') }}"></script>
</body>
</html>
