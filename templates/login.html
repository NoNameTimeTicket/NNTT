{% extends 'base.html' %}

{% block title %}로그인 - NNTT{% endblock %}

{% block content %}
    <h2>로그인</h2>
    <form style="max-width: 400px; margin-top: 20px;">
        <div style="margin-bottom: 15px;">
            <label for="email" style="display: block; margin-bottom: 5px;">아이디 (이메일)</label>
            <input type="email" id="email" style="width: 100%; padding: 8px; box-sizing: border-box;" required>
        </div>
        <div style="margin-bottom: 15px;">
            <label for="password" style="display: block; margin-bottom: 5px;">비밀번호</label>
            <input type="password" id="password" style="width: 100%; padding: 8px; box-sizing: border-box;" required>
        </div>
        <button type="submit" style="width: 100%; padding: 10px; background-color: #333; color: white; border: none; cursor: pointer;">
            로그인
        </button>
    </form>
{% endblock %}
